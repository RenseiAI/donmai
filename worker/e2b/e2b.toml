# e2b sandbox template config for the donmai runner-in-box worker.
#
# This file is normally (re)generated by `e2b template build`, which also writes
# the resulting `template_id`. It is committed here as the source-of-truth
# template definition so the image can be rebuilt deterministically. After a
# successful `./build.sh`, the CLI will fill in / update `template_id` below.
#
# template_id recorded after the first successful CI build of the donmai-worker
# e2b template (.github/workflows/e2b-template.yml). The e2b CLI prints the ID
# to stdout but does not write it back into this file, so it is recorded here
# manually. Re-running the workflow reuses this same template name/ID.
template_id = "6cu5lh5gj3z2hp7s14vp"
template_name = "donmai-worker"
dockerfile = "e2b.Dockerfile"

# Long-lived keep-alive. The platform e2b provider execs `donmai agent run`
# inside the sandbox itself (when the pool config sets launchRunnerInline=true),
# so the start command must NOT be `donmai agent run` (that would duplicate the
# runner) — it just needs to keep the sandbox alive.
start_cmd = "sleep infinity"
