          - k8s.io/klog/v2
  exclusions:
    rules:
      # tparallel bundles one correctness check with one style nag. Keep the
      # correctness half ("should use t.Cleanup instead of defer" — the real
      # torn-down-state bug) and drop the nag: "subtests should call
      # t.Parallel" fires 33 times on tests that are perfectly correct, and a
      # guard people learn to scroll past stops guarding anything.
      - linters:
          - tparallel
        text: "subtests should call t.Parallel"
      # Quickfix suggestions (QF*) are style hints, not bug indicators.
      - linters:
          - staticcheck
        text: "^QF[0-9]+"
      # G304 (file inclusion via variable) in tests: paths come from t.TempDir().
      - path: _test\.go
        linters:
          - gosec
        text: "G304"
      # G101 (hardcoded credentials) in tests: fixtures embed fake tokens /
      # token-bearing URLs to exercise credential-stripping and env-hardening
      # logic; these are not real secrets.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
