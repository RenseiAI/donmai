version: "2"

# Linter configuration for donmai.

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gocritic
    - revive
    - gosec
    # tparallel catches the "lifecycle ordering" shape of the unfailable-test
    # gate (donmai-architecture/agents/PROTOCOL.md § V V19): a parent test whose
    # `defer` teardown fires while a `t.Parallel()` subtest is still paused, so
    # the subtest runs against torn-down state and can never legitimately pass.
    # Zero violations today — it is a forward guard, not a cleanup.
    - tparallel
    - depguard
  settings:
    depguard:
      rules:
        allowlist:
          allow:
          - $gostd
          - charm.land/bubbles/v2
          - charm.land/bubbletea/v2
          - charm.land/lipgloss/v2
          - dario.cat/mergo
          - github.com/BurntSushi/toml
          - github.com/Microsoft/go-winio
          - github.com/ProtonMail/go-crypto
          - github.com/RenseiAI/donmai
          - github.com/RenseiAI/tui-components
          - github.com/alicebob/miniredis/v2
          - github.com/asaskevich/govalidator
          - github.com/atotto/clipboard
          - github.com/aymanbagabas/go-osc52/v2
          - github.com/aymerick/raymond
