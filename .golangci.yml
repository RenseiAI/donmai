version: "2"

# Linter configuration for donmai.

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gocritic
    - revive
    - gosec
    # tparallel catches the "lifecycle ordering" shape of the unfailable-test
    # gate (donmai-architecture/agents/PROTOCOL.md § V V19): a parent test whose
    # `defer` teardown fires while a `t.Parallel()` subtest is still paused, so
    # the subtest runs against torn-down state and can never legitimately pass.
    # Zero violations today — it is a forward guard, not a cleanup.
    - tparallel
  exclusions:
    rules:
      # tparallel bundles one correctness check with one style nag. Keep the
      # correctness half ("should use t.Cleanup instead of defer" — the real
      # torn-down-state bug) and drop the nag: "subtests should call
      # t.Parallel" fires 33 times on tests that are perfectly correct, and a
      # guard people learn to scroll past stops guarding anything.
      - linters:
          - tparallel
        text: "subtests should call t.Parallel"
      # Quickfix suggestions (QF*) are style hints, not bug indicators.
      - linters:
          - staticcheck
        text: "^QF[0-9]+"
      # G304 (file inclusion via variable) in tests: paths come from t.TempDir().
      - path: _test\.go
        linters:
          - gosec
        text: "G304"
      # G101 (hardcoded credentials) in tests: fixtures embed fake tokens /
      # token-bearing URLs to exercise credential-stripping and env-hardening
      # logic; these are not real secrets.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
