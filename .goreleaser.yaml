version: 2

project_name: donmai

builds:
  - id: donmai
    main: ./cmd/donmai
    binary: donmai
    ldflags:
      # -X main.version powers `donmai --version` AND the daemon's
      # /api/daemon/status `Version` field (via Config.HostBinaryVersion).
      # Without the -X injection the binary reports "dev" forever, which
      # made `rensei host status` (which reads the daemon HTTP endpoint)
      # display the vendored package default instead of the running release tag.
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "donmai_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# macOS code signing + notarization.
#
# Sign darwin binaries with the Apple Developer ID Application certificate
# (Yuisei-iOS enrollment). Hardened runtime is enabled
# (--options runtime) which is mandatory for notarization. After signing,
# the archive is submitted to Apple's notarytool service for stapler-less
# online notarization (.tar.gz can't be stapled; binaries get notarization
# tickets via online check).
#
# Why we shell out to native `codesign` + `xcrun notarytool` instead of
# GoReleaser's built-in `notarize:` block:
#   - Built-in signer uses Go's x509 library, which rejects Apple Developer ID
#     certs with `failed to verify certificate chain: x509: unhandled critical
#     extension` (Apple's critical extension 1.2.840.113635.100.6.1.13 is not
#     recognized by Go's strict x509 parser). v0.3.1 release failed at this
#     step.
#   - Built-in notarize uses App Store Connect API key shape
#     (issuer_id/key_id/key); our secrets are Apple ID + app-specific password.
#   - The native macOS toolchain handles both cases correctly.
#
# The keychain is set up by the `Import Apple Developer ID cert to keychain`
# step in .github/workflows/release.yml (RUNNER_TEMP keychain — ephemeral,
# auto-cleanup).
#
# Local dry-run note: use `make release-dry-run`, which passes `--skip=sign`
# explicitly. Snapshot mode skips publication but GoReleaser v2 still runs
# custom sign pipes unless told otherwise. Real signing fires on tag-pushed CI
# runs that have the APPLE_* secrets set.
signs:
  - id: macos-codesign-and-notarize
    artifacts: archive
    # No `ids:` filter — apply to all archives. The script's case statement
    # filters by *_darwin_* and skips Linux archives. Previously this was
    # `ids: [donmai]` but archive id is `default` (see archives block above), so
    # the signs block silently skipped every artifact in v0.3.2.
    cmd: ./scripts/sign-and-notarize.sh
    args:
      - "${artifact}"
    # Explicitly NOT `${artifact}.sig`. This block emits a human-readable
    # notarization record, not a detached signature — codesign embeds the real
    # signature inside the binary. Sigstore owns `.sig` (see cosign-keyless
    # below), and before this rename both wrote the same path, so which file
    # shipped depended on signs[] ordering: a reorder would have published a
    # five-line text file reading "Signature: none" under a name that means
    # "signature".
    signature: "${artifact}.codesign.txt"
    output: true

  # Sigstore keyless signing — covers EVERY archive on EVERY platform, which is
  # what the macOS signer above cannot do by construction: sign-and-notarize.sh
  # short-circuits every non-darwin archive with `exit 0`, so before this block
  # the only thing shipped for Linux was checksums.txt.
  #
  # Keyless (OIDC) on purpose: no private key exists to store, rotate, or leak.
  # The GitHub Actions OIDC token identifies the workflow, cosign records the
  # certificate in the public Rekor transparency log, and the signer identity is
  # the workflow ref itself. This requires `id-token: write` on the job.
  #
  # Verify a release artifact with:
  #   cosign verify-blob \
  #     --certificate donmai_<ver>_linux_amd64.tar.gz.pem \
  #     --signature   donmai_<ver>_linux_amd64.tar.gz.sig \
  #     --certificate-identity-regexp '^https://github\.com/RenseiAI/donmai/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     donmai_<ver>_linux_amd64.tar.gz
  - id: cosign-keyless
    artifacts: archive
    cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--output-certificate=${signature}.pem"
      - "--output-signature=${signature}"
      - "${artifact}"
    signature: "${artifact}.sig"
    output: true

  # The checksum manifest is the root of trust for anyone verifying by digest,
  # so it gets the same treatment as the archives.
  - id: cosign-keyless-checksums
    artifacts: checksum
    cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--output-certificate=${signature}.pem"
      - "--output-signature=${signature}"
      - "${artifact}"
    signature: "${artifact}.sig"
    output: true

homebrew_casks:
  - name: donmai
    # Only an automatic stable tag push may update the rolling stable cask.
    # The staged verifier exports false for prereleases and every manual retry,
    # so replaying an older tag cannot roll Casks/donmai.rb backward.
    skip_upload: '{{ if eq .Env.GORELEASER_PUBLISH_HOMEBREW "true" }}false{{ else }}true{{ end }}'
    repository:
      owner: RenseiAI
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/RenseiAI/donmai"
    description: "Donmai CLI — terminal dashboard and CLI for AI agent fleets"
    binaries:
      - donmai

checksum:
  name_template: "checksums.txt"

release:
  # If GitHub must create the tag while publishing, anchor it to the exact
  # commit GoReleaser built rather than the repository's moving default branch.
  target_commitish: "{{ .Commit }}"
  # Automatic stable tag pushes retain GoReleaser's historical "make latest"
  # behavior. Prereleases and manual retries export false so neither can replace
  # the repository's current GitHub Latest release.
  make_latest: '{{ if eq .Env.GORELEASER_MAKE_LATEST "false" }}false{{ else }}true{{ end }}'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
