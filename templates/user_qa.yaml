apiVersion: v1
kind: WorkflowTemplate
metadata:
  name: user_qa
  description: QA/validation directive — validate implementation against acceptance criteria
  workType: qa
prompt: |
  Validate the implementation referenced by {{#if issueIdentifier}}{{issueIdentifier}}{{else}}<unidentified issue>{{/if}}.

  # Issue context

  {{context}}
  {{#if parentContext}}
  # Parent issue context

  {{parentContext}}
  {{/if}}{{#if mentionContext}}
  # Mention context

  {{mentionContext}}
  {{/if}}
  # What to do

  1. Read the acceptance criteria from the issue description.
  2. Inspect the implementing branch (or open PR) for {{#if issueIdentifier}}{{issueIdentifier}}{{else}}the issue{{/if}}.
  3. Run the project's test, typecheck, and lint commands. Capture any failures.
  4. Decide pass or fail strictly against the acceptance criteria.
  5. Post a comment on {{#if issueIdentifier}}{{issueIdentifier}}{{else}}the issue{{/if}} via `{{brandCLI}} linear create-comment` summarising what you checked and the verdict.
  6. Before you finish, write your verdict to `.agent/turn-result.json` (relative to the worktree root). The file is JSON of the form `{"schemaVersion": 1, "verdict": "passed", "summary": "<one line>"}`. The `verdict` is exactly one of:

     - `passed` when every acceptance criterion is met and tests are green.
     - `failed` when any criterion is missed or tests regress.
     - `blocked` when you cannot validate at all because the work is not actionable as specified — no acceptance criteria to check against, no implementing branch/PR to inspect, or a contradictory spec. Prefer this over `WORK_RESULT:failed` when there is nothing to validate without more input; put the reason on the same line as `AGENT_BLOCKED: <reason>`. The orchestrator routes a blocked verdict for clarification instead of retrying.

     Then end your final assistant message with the matching fallback marker (`WORK_RESULT:passed` / `WORK_RESULT:failed`, or `WORK_RESULT:blocked` plus `AGENT_BLOCKED: <reason>` on its own line), plus one `REVIEW_VERDICT:` line holding exactly one of APPROVE, APPROVE_WITH_FOLLOWUPS or REQUEST_CHANGES. The manifest file is authoritative; the marker is the backstop if the file could not be written. When you write the manifest, carry the same review outcome as its `reviewVerdict` field.

  Do not implement code yourself. Do not delete the worktree.
