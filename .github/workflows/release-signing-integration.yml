name: Release signing integration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-signing-integration.yml
      - .github/workflows/release.yml
      - .goreleaser.yaml
      - scripts/sign-and-notarize.sh
      - scripts/test-sign-and-notarize.sh
      - scripts/test-release-workflows.sh
      - go.mod
  push:
    branches: [main]
    paths:
      - .github/workflows/release-signing-integration.yml
      - .github/workflows/release.yml
      - .goreleaser.yaml
      - scripts/sign-and-notarize.sh
      - scripts/test-sign-and-notarize.sh
      - scripts/test-release-workflows.sh
      - go.mod

permissions:
  contents: read

jobs:
  signing-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Keep this action SHA and version identical to release.yml. The test
      # supplies local replacements for Apple tools and cosign; no release
      # credentials or publication permissions are needed here.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "v2.17.1"
          install-only: true

      - name: Verify GoReleaser version
        run: |
          goreleaser --version | grep -Fq 'GitVersion:    2.17.1'

      - name: Hermetic signing pipeline
        env:
          GOTOOLCHAIN: go1.26.10
          GOWORK: "off"
        run: bash scripts/test-sign-and-notarize.sh --goreleaser
