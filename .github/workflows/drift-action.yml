name: Native drift Action
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: native-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read trusted base Action only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            action.yml
            action
          sparse-checkout-cone-mode: false
      - name: Check bootstrap availability
        id: bootstrap
        shell: bash
        run: |
          if [[ -f action.yml && -f action/run.py ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Base commit predates the Action. No assessment ran; dogfood starts after this Action lands.'
          fi
      - name: Assess complete PR diff
        if: steps.bootstrap.outputs.ready == 'true'
        uses: ./
        with:
          token: ${{ github.token }}
          comment: auto
