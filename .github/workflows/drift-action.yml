name: Native drift Action
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: native-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Assess complete PR diff
        uses: RenseiAI/donmai-drift-action@729b5d1fe1525eabf21517cf9c43be5f0a6fc7d6 # v1.0.0
        with:
          token: ${{ github.token }}
          comment: auto
