name: Native drift Action
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: native-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Assess complete PR diff
        uses: RenseiAI/donmai-drift-action@a52d98dcee713278d505c482f3975695bf233e8e # v1.0.1
        with:
          token: ${{ github.token }}
          comment: auto
