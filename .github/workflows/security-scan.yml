name: Security Scan
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  # `Secret scan (trufflehog)` is a required check on main; the merge-queue
  # ruleset builds merge-group refs, so the workflow must run there too or
  # queued PRs stall until the queue's check timeout. On merge_group the
  # action has no PR base/head and falls back to a full-history scan — the
  # same scan the weekly schedule already runs green.
  merge_group:
  schedule: [{ cron: "0 7 * * 1" }]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --only-verified
  govulncheck:
    name: Go vuln scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Verify Go compiler
        run: ./scripts/verify-go-compiler.sh
      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... | tee "${RUNNER_TEMP}/govulncheck.log"
      - name: Record scanned commit
        run: |
          set -euo pipefail
          {
            echo "### govulncheck"
            echo
            echo "commit SHA: ${GITHUB_SHA}"
            echo "workflow SHA: ${{ github.sha }}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "govulncheck scanned commit ${GITHUB_SHA}"
      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-${{ github.sha }}
          path: ${{ runner.temp }}/govulncheck.log
          if-no-files-found: error
          retention-days: 30
  semgrep:
    name: SAST (semgrep, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install semgrep
        run: |
          # Semgrep 1.97's OpenTelemetry dependency imports pkg_resources,
          # which setuptools 81+ no longer ships.
          python -m pip install --upgrade \
            pip==25.3 \
            setuptools==80.9.0 \
            wheel==0.45.1
          python -m pip install semgrep==1.97.0
          semgrep --version
      - name: Run semgrep
        run: |
          mkdir -p artifacts
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --sarif \
            --output artifacts/semgrep.sarif
          semgrep_status=$?
          set -e

          if [[ ! -s artifacts/semgrep.sarif ]]; then
            echo "::error::semgrep did not produce a SARIF report"
            exit 2
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/semgrep.sarif").read_text())
          if report.get("version") != "2.1.0" or not report.get("runs"):
              raise SystemExit("semgrep produced an invalid SARIF report")
          PY

          case "$semgrep_status" in
            0) ;;
            1) echo "::warning::semgrep reported findings (report-only)" ;;
            *)
              echo "::error::semgrep execution failed with exit code $semgrep_status"
              exit "$semgrep_status"
              ;;
          esac
      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: artifacts/semgrep.sarif
          if-no-files-found: error
          retention-days: 30
