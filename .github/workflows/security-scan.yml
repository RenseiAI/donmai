name: Security Scan
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  # `Secret scan (trufflehog)` is a required check on main; the merge-queue
  # ruleset builds merge-group refs, so the workflow must run there too or
  # queued PRs stall until the queue's check timeout. On merge_group the
  # action has no PR base/head and falls back to a full-history scan — the
  # same scan the weekly schedule already runs green.
  merge_group:
  schedule: [{ cron: "0 7 * * 1" }]
permissions:
  contents: read
jobs:
  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --only-verified
  govulncheck:
    name: Go vuln scan (report-only)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck reported vulnerabilities (report-only)"
  semgrep:
    name: SAST (semgrep, report-only)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Run semgrep
        run: |
          pip install semgrep==1.97.0
          semgrep scan --config p/security-audit --config p/secrets --error || echo "::warning::semgrep reported findings (report-only)"
