name: Security Scan
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  # `Secret scan (trufflehog)` is a required check on main; the merge-queue
  # ruleset builds merge-group refs, so the workflow must run there too or
  # queued PRs stall until the queue's check timeout. On merge_group the
  # action has no PR base/head and falls back to a full-history scan — the
  # same scan the weekly schedule already runs green.
  merge_group:
  schedule: [{ cron: "0 7 * * 1" }]
permissions:
  contents: read
jobs:
  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --only-verified
  govulncheck:
    name: Go vuln scan (report-only)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck reported vulnerabilities (report-only)"
  semgrep:
    name: SAST (semgrep, report-only)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install semgrep
        run: |
          # Semgrep 1.97's OpenTelemetry dependency imports pkg_resources,
          # which setuptools 81+ no longer ships.
          python -m pip install --upgrade \
            pip==25.3 \
            setuptools==80.9.0 \
            wheel==0.45.1
          python -m pip install semgrep==1.97.0
          semgrep --version
      - name: Run semgrep
        run: |
          mkdir -p artifacts
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --sarif \
            --output artifacts/semgrep.sarif
          semgrep_status=$?
          set -e

          if [[ ! -s artifacts/semgrep.sarif ]]; then
            echo "::error::semgrep did not produce a SARIF report"
            exit 2
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/semgrep.sarif").read_text())
          if report.get("version") != "2.1.0" or not report.get("runs"):
              raise SystemExit("semgrep produced an invalid SARIF report")
          PY

          case "$semgrep_status" in
            0) ;;
            1) echo "::warning::semgrep reported findings (report-only)" ;;
            *)
              echo "::error::semgrep execution failed with exit code $semgrep_status"
              exit "$semgrep_status"
              ;;
          esac
      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: artifacts/semgrep.sarif
          if-no-files-found: error
          retention-days: 30
