name: worker-image-pr

on:
  pull_request:
    branches: [main]
    # Prose-only changes cannot alter the image: the build stage compiles Go
    # sources and the runtime stage installs pinned toolchains, neither of
    # which reads a Markdown file. PR #223 (CHANGELOG.md, one file) still paid
    # a full 8-minute multi-arch build. `paths-ignore` fails safe — a PR that
    # touches ANY non-ignored file still builds — and this job is not a
    # required status check on main (required: `test`, `Secret scan
    # (trufflehog)`), so a skipped run cannot stall a PR or the merge queue.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build:
    name: Build worker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      # Cache isolation: both builds use the GitHub Actions cache backend
      # (cache-from: type=gha, cache-to: type=gha,mode=max). GHA cache
      # writes are scoped to the git ref that produced them — a pull_request
      # build's cache entries never feed the tag-triggered release build —
      # so the PR build can stay warm without ever influencing what a
      # release publishes. Neither build touches a persistent sticky-disk
      # builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DONMAI_VERSION=pr-${{ github.event.pull_request.number }}-${{ github.sha }}
