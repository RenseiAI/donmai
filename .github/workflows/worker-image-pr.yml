name: worker-image-pr

on:
  pull_request:
    branches: [main]
    # Prose-only changes cannot alter the image: the build stage compiles Go
    # sources and the runtime stage installs pinned toolchains, neither of
    # which reads a Markdown file. PR #223 (CHANGELOG.md, one file) still paid
    # a full 8-minute multi-arch build. `paths-ignore` fails safe — a PR that
    # touches ANY non-ignored file still builds — and this job is not a
    # required status check on main (required: `test`, `Secret scan
    # (trufflehog)`), so a skipped run cannot stall a PR or the merge queue.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build:
    name: Build worker image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      # SECURITY (CREEP-class cache poisoning, CVE-2025-36852 pattern):
      # useblacksmith/setup-docker-builder mounts a persistent BuildKit state
      # dir (a Blacksmith "sticky disk") at /var/lib/buildkit and commits it
      # back at the end of every job. Confirmed against the pinned action's
      # own action.yml/README (useblacksmith/setup-docker-builder@33803e6,
      # tag v2.0.0): the sticky disk is scoped by an explicit `cache-key`
      # input, NOT by git ref/trust level, and when `cache-key` is omitted
      # (as both this workflow and worker-image.yml previously did) it falls
      # back to an implicit default derived from the Dockerfile path — the
      # SAME implicit key worker-image.yml (the release build, on push tags
      # v*) also fell back to. That meant an untrusted PR build here and the
      # trusted release build shared one persistent layer cache: a PR build
      # could seed layers the release build would later reuse without ever
      # rebuilding them. There is no input to disable the sticky disk on this
      # action — persistence is the entire point of it — so PR builds no
      # longer use it at all: plain, ephemeral docker/setup-buildx-action +
      # docker/build-push-action below, no cache-from/cache-to, no state
      # survives the job. worker-image.yml keeps the fast Blacksmith path but
      # now pins its own explicit cache-key (see that file) so its cache can
      # only ever have been seeded by trusted push/tag builds.
      #
      # This makes PR builds slower (no warm cache) than before. That's an
      # accepted tradeoff: PR validation only needs to prove the image
      # BUILDS, it does not need cache warmth, and it must never be able to
      # influence what a release publishes.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            DONMAI_VERSION=pr-${{ github.event.pull_request.number }}-${{ github.sha }}
