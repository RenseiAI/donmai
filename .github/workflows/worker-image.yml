name: worker-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to retry (for example, v1.2.3)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # Stage the current workflow's verifier before checking out an older tag
      # that may not contain the shared release automation yet.
      - name: Checkout release automation
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Stage release automation
        run: install -m 0755 scripts/verify-release-tag.sh "${RUNNER_TEMP}/verify-release-tag.sh"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify immutable release ref
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          "${RUNNER_TEMP}/verify-release-tag.sh" --verify \
            "${RELEASE_TAG}" \
            "${GITHUB_EVENT_NAME}" \
            "${GITHUB_OUTPUT}" \
            "${GITHUB_ENV}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            echo "::notice::Manual retry publishes only ${RELEASE_TAG}; latest is unchanged."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@6ff44f8e5255f9d8aa31ef22f7e57a2d926b7da0 # v1.11.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2.2.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DONMAI_VERSION=${{ steps.release.outputs.tag }}
          tags: ${{ steps.release.outputs.image_tags }}
