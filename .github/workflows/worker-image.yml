name: worker-image

# Every verified release tag publishes an immutable versioned image. Only an
# automatic stable tag push also advances the rolling `latest` image.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to retry (for example, v1.2.3)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  release-authority:
    name: release-authority (signed tag + two rulesets)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify live release authority
        run: ./scripts/verify-release-authority.sh "${GITHUB_REPOSITORY}" "${RELEASE_TAG}"

  build-and-push:
    needs: release-authority
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      # Stage the current workflow's verifier before checking out an older tag
      # that may not contain the shared release automation yet.
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Stage release automation
        run: install -m 0755 scripts/verify-release-tag.sh "${RUNNER_TEMP}/verify-release-tag.sh"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify immutable release ref
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          "${RUNNER_TEMP}/verify-release-tag.sh" --verify \
            "${RELEASE_TAG}" \
            "${GITHUB_EVENT_NAME}" \
            "${GITHUB_OUTPUT}" \
            "${GITHUB_ENV}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            echo "::notice::Manual retry publishes only ${RELEASE_TAG}; latest is unchanged."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      # SECURITY (CREEP-class cache poisoning, CVE-2025-36852 pattern; see
      # worker-image-pr.yml for the full finding): this action's sticky disk
      # is scoped by `cache-key`, which neither this workflow nor
      # worker-image-pr.yml used to set — both fell back to the same implicit
      # default key, so the untrusted PR build and this release build shared
      # one persistent layer cache. worker-image-pr.yml no longer touches a
      # Blacksmith sticky disk at all, but any layers a PR run already wrote
      # under that old implicit default key could still be sitting in it.
      # Pin an explicit cache-key here that no prior run (PR or release) has
      # ever used, so this build's cache is provably seeded only by trusted
      # push/tag builds from this point forward — a one-time invalidation.
      # To force another invalidation later (e.g. after a compromised build),
      # bump the suffix (-v2, -v3, ...).
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@33803e640bd9d674f2843a8c323aa2a7da478d23 # v2.0.0
        with:
          cache-key: donmai/worker-image-release-v1

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2.2.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DONMAI_VERSION=${{ steps.release.outputs.tag }}
          tags: ${{ steps.release.outputs.image_tags }}
