name: worker-image

# Every verified release tag publishes an immutable versioned image. Only an
# automatic stable tag push also advances the rolling `latest` image.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to retry (for example, v1.2.3)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  release-authority:
    name: release-authority (signed tag + two rulesets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify live release authority
        env:
          # Tagging-identity pins; unset keeps the transitional policy. See
          # scripts/verify-release-authority.sh and RELEASING.md.
          RELEASE_TAG_CREATOR: ${{ vars.RELEASE_TAG_CREATOR }}
          RELEASE_TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
          RELEASE_TAG_SIGNERS: ${{ vars.RELEASE_TAG_SIGNERS }}
        run: ./scripts/verify-release-authority.sh "${GITHUB_REPOSITORY}" "${RELEASE_TAG}"

  build-and-push:
    needs: release-authority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Stage the current workflow's verifier before checking out an older tag
      # that may not contain the shared release automation yet.
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Stage release automation
        run: install -m 0755 scripts/verify-release-tag.sh "${RUNNER_TEMP}/verify-release-tag.sh"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify immutable release ref
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          "${RUNNER_TEMP}/verify-release-tag.sh" --verify \
            "${RELEASE_TAG}" \
            "${GITHUB_EVENT_NAME}" \
            "${GITHUB_OUTPUT}" \
            "${GITHUB_ENV}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            echo "::notice::Manual retry publishes only ${RELEASE_TAG}; latest is unchanged."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      # Both image builds share the GitHub Actions cache backend
      # (cache-from: type=gha, cache-to: type=gha,mode=max). GHA cache
      # writes are scoped to the git ref that produced them, so PR builds
      # cannot seed layers the tag-triggered release build would reuse.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DONMAI_VERSION=${{ steps.release.outputs.tag }}
          tags: ${{ steps.release.outputs.image_tags }}
