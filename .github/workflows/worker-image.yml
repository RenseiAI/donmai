name: worker-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (defaults to 'latest')"
        required: false
        default: latest
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DONMAI_VERSION=${{ inputs.version || github.ref_name }}
          tags: |
            ghcr.io/renseiai/donmai-worker:${{ inputs.version || github.ref_name }}
            ghcr.io/renseiai/donmai-worker:latest
