name: e2b-template

# Builds the `donmai-worker` E2B sandbox template in CI.
#
# GitHub-hosted runners provide Docker, so this avoids requiring local Docker
# or interactive `e2b auth login`. The e2b CLI (v2.10.x) authenticates the
# `template create` build path non-interactively via the E2B_API_KEY env var
# (the org/team API key from https://e2b.dev/dashboard?tab=keys). NOTE: despite
# what an earlier version of this file claimed, `template create` does NOT use
# E2B_ACCESS_TOKEN — that var only authenticates account-management commands.
# Verified against @e2b/cli 2.10.2: the build path calls
# `apiKey = process.env.E2B_API_KEY` and errors "You must be logged in ... set
# the E2B_API_KEY environment variable" when it is missing.
#
# Runs automatically on every release tag (push: tags v*) and supports manual
# retries only for an explicit existing release tag, so the baked worker binary
# can never silently lag or be rebuilt from a branch labeled as an old release.
# The manual path remains detached at the verified tag and never writes back to
# the repository. release.yml fires on the same tag (notarized binary release);
# the two run independently. Add the E2B_API_KEY repo secret before running it
# (Settings ->
# Secrets and variables -> Actions). E2B_ACCESS_TOKEN is also passed through
# when present, for any management call.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to retry (for example, v1.2.3)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-template:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify immutable release ref
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release ref must be an explicit version tag, not a branch or template label: ${RELEASE_TAG}"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "::error::Release ref must be an existing tag: ${RELEASE_TAG}"
            exit 1
          fi
          if branch_ref="$(git symbolic-ref -q HEAD)"; then
            echo "::error::Release checkout must be detached at ${RELEASE_TAG}, not branch ${branch_ref}"
            exit 1
          fi
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          if [ "${tag_sha}" != "${head_sha}" ]; then
            echo "::error::Checked-out SHA ${head_sha} does not match ${RELEASE_TAG} (${tag_sha})"
            exit 1
          fi
          printf 'tag=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Rebuilding the E2B template for ${RELEASE_TAG} at immutable commit ${head_sha}"

      - name: Guard - require E2B_API_KEY secret
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${E2B_API_KEY}" ]; then
            echo "::error::E2B_API_KEY secret is not set."
            echo "::error::The e2b CLI 'template create' build path authenticates via E2B_API_KEY (NOT E2B_ACCESS_TOKEN)."
            echo "::error::Add it at: donmai repo Settings -> Secrets and variables -> Actions."
            echo "::error::Get the key from https://e2b.dev/dashboard?tab=keys (the org/team API key)."
            exit 1
          fi
          echo "E2B_API_KEY is present."

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install e2b CLI
        run: |
          npm install -g @e2b/cli
          e2b --version

      - name: Cross-compile donmai binary (linux/amd64)
        env:
          # Both automatic builds and manual retries use the tag that the
          # immutable-ref guard peeled and matched to HEAD above.
          VERSION: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o worker/e2b/donmai \
            ./cmd/donmai
          chmod +x worker/e2b/donmai
          ls -lh worker/e2b/donmai

      - name: Build E2B template (donmai-worker)
        working-directory: worker/e2b
        env:
          # `template create` authenticates via E2B_API_KEY (verified against
          # @e2b/cli 2.10.2). E2B_ACCESS_TOKEN is passed through too for any
          # management call, but the build path requires E2B_API_KEY.
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_ACCESS_TOKEN: ${{ secrets.E2B_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # e2b CLI v2.10.2: `template create <template-name>` builds
          # e2b.Dockerfile from the cwd and pushes it. The name is a POSITIONAL
          # argument (there is no -n flag). When a start command (-c) is set, the
          # CLI requires a matching ready command (--ready-cmd, no short flag) —
          # for a keep-alive sandbox `true` (always ready) suffices. The platform
          # e2b provider execs `donmai agent run` inline, so the start command is
          # just a keep-alive (`sleep infinity`).
          #
          # NOTE: `template create` (unlike the legacy `template init`/`build`
          # flow) does NOT write the resulting template_id back into e2b.toml. It
          # only prints "Template created with ID: <id>" to stdout. We tee the
          # output so the next step can parse the ID and persist it.
          e2b template create donmai-worker \
            -d e2b.Dockerfile \
            -c "sleep infinity" \
            --ready-cmd "true" 2>&1 | tee /tmp/e2b-build.log

      - name: Surface template ID
        working-directory: worker/e2b
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "e2b.toml after build:"
          cat e2b.toml
          echo "===================================================="
          # Prefer template_id already in e2b.toml; otherwise parse the build
          # log line: "... Template created with ID: <id>, Build ID: <buildid>".
          TEMPLATE_ID="$(grep -E '^[[:space:]]*template_id[[:space:]]*=' e2b.toml | head -1 | sed -E 's/.*=[[:space:]]*"?([^"]*)"?.*/\1/' || true)"
          if [ -z "${TEMPLATE_ID}" ] && [ -f /tmp/e2b-build.log ]; then
            TEMPLATE_ID="$(grep -oE 'Template created with ID: [a-z0-9]+' /tmp/e2b-build.log | head -1 | sed -E 's/.*ID: //' || true)"
            if [ -n "${TEMPLATE_ID}" ]; then
              echo "Parsed template_id from build log: ${TEMPLATE_ID}"
              # Record it in this detached checkout so the remainder of the job
              # and its logs reference the exact template created by this retry.
              if grep -qE '^[[:space:]]*template_id[[:space:]]*=' e2b.toml; then
                sed -i -E "s|^[[:space:]]*template_id[[:space:]]*=.*|template_id = \"${TEMPLATE_ID}\"|" e2b.toml
              else
                printf 'template_id = "%s"\n' "${TEMPLATE_ID}" >> e2b.toml
              fi
              echo "e2b.toml after writing template_id:"
              cat e2b.toml
            fi
          fi
          if [ -n "${TEMPLATE_ID}" ]; then
            echo "::notice::donmai-worker template_id = ${TEMPLATE_ID}"
            echo "## donmai-worker template_id: \`${TEMPLATE_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not parse template_id from e2b.toml or build log; check the build log above."
          fi
