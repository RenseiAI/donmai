name: e2b-template

# Builds the `donmai-worker` E2B sandbox template in CI.
#
# The Dockerfile build authenticates non-interactively with E2B_API_KEY (the
# org/team API key from https://e2b.dev/dashboard?tab=keys).
#
# Every release writes the verified semantic version to an explicit E2B target
# such as `donmai-worker:v0.53.0`. Automatic tag pushes also assign `default` to
# the same build, preserving the rolling target. Manual retries rebuild only the
# version target, so retrying an older release cannot move `default`.
#
# @e2b/cli 2.13.3 help confirms `template create` accepts only an untagged name
# constrained to lowercase letters, numbers, dashes, and underscores. E2B's
# supported SDK `Template.build(template, "name:tag", { tags: [...] })` API is
# therefore used for the version and optional rolling tags.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to retry (for example, v1.2.3)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-template:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # Keep the current workflow's verifier and tagged-build wrapper available
      # when a manual retry checks out a release that predates these scripts.
      - name: Checkout release automation
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Stage release automation
        run: |
          install -m 0755 scripts/verify-release-tag.sh "${RUNNER_TEMP}/verify-release-tag.sh"
          install -m 0644 scripts/build-e2b-template.cjs "${RUNNER_TEMP}/build-e2b-template.cjs"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify immutable release ref
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          "${RUNNER_TEMP}/verify-release-tag.sh" --verify \
            "${RELEASE_TAG}" \
            "${GITHUB_EVENT_NAME}" \
            "${GITHUB_OUTPUT}" \
            "${GITHUB_ENV}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            echo "::notice::Manual retry rebuilds only donmai-worker:${RELEASE_TAG}; default is unchanged."
          fi

      - name: Guard - require E2B_API_KEY secret
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${E2B_API_KEY}" ]]; then
            echo "::error::E2B_API_KEY secret is not set."
            echo "::error::Add the org/team API key from https://e2b.dev/dashboard?tab=keys."
            exit 1
          fi
          echo "E2B_API_KEY is present."

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install pinned E2B CLI and SDK
        run: |
          set -euo pipefail
          npm install --global @e2b/cli@2.13.3 e2b@2.33.1
          e2b --version
          printf 'NODE_PATH=%s\n' "$(npm root --global)" >> "${GITHUB_ENV}"

      - name: Cross-compile donmai binary (linux/amd64)
        env:
          VERSION: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o worker/e2b/donmai \
            ./cmd/donmai
          chmod +x worker/e2b/donmai
          ls -lh worker/e2b/donmai

      - name: Build versioned E2B template
        id: template
        working-directory: worker/e2b
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_TEMPLATE_REF: ${{ steps.release.outputs.e2b_template_ref }}
          E2B_ADDITIONAL_TAGS: ${{ steps.release.outputs.e2b_additional_tags }}
        run: node "${RUNNER_TEMP}/build-e2b-template.cjs"

      - name: Summarize E2B template build
        env:
          TEMPLATE_REF: ${{ steps.template.outputs.template_ref }}
          TEMPLATE_ID: ${{ steps.template.outputs.template_id }}
          BUILD_ID: ${{ steps.template.outputs.build_id }}
        run: |
          {
            printf '## E2B template release\n\n'
            printf -- "- Target: \`%s\`\n" "${TEMPLATE_REF}"
            printf -- "- Template ID: \`%s\`\n" "${TEMPLATE_ID}"
            printf -- "- Build ID: \`%s\`\n" "${BUILD_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
