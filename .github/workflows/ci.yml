name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The repo's merge-queue ruleset builds merge-group refs; without this
  # trigger the required `test` check never reports there and every queued
  # PR stalls until the queue's 30-minute check timeout.
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-authority-visibility:
    name: release-authority visibility (read-only)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prove structural ruleset visibility with github.token
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-release-authority.sh --check-actor-visibility "${GITHUB_REPOSITORY}"

  # The closed-source content guard (self-test, vendor-drift check, and the
  # commit/squash-message scans) lives in its own workflow now:
  # .github/workflows/guard-b.yml — it needs PR `edited`/`ready_for_review`
  # triggers this workflow's `on:` block doesn't carry, since a PR body edit
  # is the squash-merge message and can introduce a leak no commit contains.
  release-contracts:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Release workflow contract tests
        run: bash scripts/test-release-workflows.sh

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The required cross-version shim gate verifies and archives the exact
          # released v0.68.2 tag/commit; a shallow PR checkout cannot prove it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node for pinned Codex fixture
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build
        run: make build

      - name: Pinned released shim overlap (v1 + v2)
        run: make test-shim-overlap
      - name: Frozen attach-v1 v0.68.2 artifact bytes
        run: make test-attach-v1-compat

      # Build-tag-gated `_test.go` files are excluded from `go build ./...` and
      # `go test ./...` entirely — not run, not compiled, not syntax-checked —
      # so they rot silently behind a green pipeline. This type-checks them.
      # `internal/testregistration` fails the Test step below if a tag on disk
      # is missing from this target's list, so registration cannot lapse.
      - name: Type-check build-tag-gated tests
        run: make test-tagged

      - name: Real Codex direct MCP fixture
        run: |
          set -euo pipefail
          fixture_dir="${RUNNER_TEMP}/codex-real-mcp-fixture"
          mkdir -p "${fixture_dir}"
          cp provider/harness/codex/testdata/real-mcp-codex-cli/package.json "${fixture_dir}/package.json"
          cp provider/harness/codex/testdata/real-mcp-codex-cli/package-lock.json "${fixture_dir}/package-lock.json"
          npm ci --prefix "${fixture_dir}" --ignore-scripts --no-audit --no-fund

          launcher="${fixture_dir}/node_modules/.bin/codex"
          native="$(find "${fixture_dir}/node_modules" -type f -path '*/vendor/*/bin/codex' -print -quit)"
          test -x "${launcher}"
          test -n "${native}"
          test -x "${native}"
          test "$("${launcher}" --version)" = "codex-cli 0.154.0"
          test "$("${native}" --version)" = "codex-cli 0.154.0"
          sha256sum "${launcher}" "${native}"
          donmai_bin="${fixture_dir}/donmai"
          GOWORK=off go build -o "${donmai_bin}" ./cmd/donmai
          test -x "${donmai_bin}"
          sha256sum "${donmai_bin}"

          result_json="${RUNNER_TEMP}/codex-real-mcp-fixture.json"
          CODEX_BIN="${launcher}" CODEX_NATIVE_BIN="${native}" DONMAI_BIN="${donmai_bin}" GOWORK=off \
            go test -race -tags codex_integration \
              -run '^TestIntegration_RealCodexInteractiveMCP(DirectCalls|HeaderHelperRefreshControls)$' \
              -count=1 -json ./provider/harness/codex \
            | tee "${result_json}" \
            | python3 scripts/test-summary.py
          python3 - "${result_json}" <<'PY'
          import json
          import sys

          targets = ["TestIntegration_RealCodexInteractiveMCPDirectCalls", "TestIntegration_RealCodexInteractiveMCPHeaderHelperRefreshControls"]
          events = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8")]
          for target in targets:
              passed = sum(event.get("Action") == "pass" and event.get("Test") == target for event in events)
              skipped = sum(event.get("Action") == "skip" and event.get("Test") == target for event in events)
              if passed != 1 or skipped != 0:
                  raise SystemExit(f"real Codex MCP fixture {target} pass={passed} skip={skipped}; want pass=1 skip=0")
          print("real Codex MCP fixtures: PASS=2 SKIP=0")
          PY

      # Piped through scripts/test-summary.py so the run reports how many
      # tests SKIPPED. `go test ./...` reports a skipped test the same way it
      # reports nothing at all — the package still says `ok` — so a test that
      # quietly starts skipping stops protecting anything while CI stays
      # green. pipefail keeps `go test`'s exit status authoritative.
      - name: Test
        run: |
          set -o pipefail
          go test -race -coverprofile=coverage.out -json ./... \
            | python3 scripts/test-summary.py

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4

      # No govulncheck step here: security-scan.yml already runs govulncheck
      # as its own `Go vuln scan (report-only)` job on the same triggers, in
      # parallel rather than serially behind the tests. The copy that used to
      # sit here was continue-on-error, so it gated nothing, and it re-ran
      # `go install ...@latest` on every build — a network fetch of an
      # unpinned tool inside the one job that main requires.
