name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The repo's merge-queue ruleset builds merge-group refs; without this
  # trigger the required `test` check never reports there and every queued
  # PR stalls until the queue's 30-minute check timeout.
  merge_group:

jobs:
  leak-guard:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Leak guard self-test
        run: bash scripts/leak-guard.sh --self-test

      - name: Closed-source content guard
        run: bash scripts/leak-guard.sh --all

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.11.4

      - name: Vulnerability check
        continue-on-error: true
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
