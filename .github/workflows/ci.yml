name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The repo's merge-queue ruleset builds merge-group refs; without this
  # trigger the required `test` check never reports there and every queued
  # PR stalls until the queue's 30-minute check timeout.
  merge_group:

jobs:
  # The closed-source content guard (self-test, vendor-drift check, and the
  # commit/squash-message scans) lives in its own workflow now:
  # .github/workflows/guard-b.yml — it needs PR `edited`/`ready_for_review`
  # triggers this workflow's `on:` block doesn't carry, since a PR body edit
  # is the squash-merge message and can introduce a leak no commit contains.
  release-contracts:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Release workflow contract tests
        run: bash scripts/test-release-workflows.sh

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The required cross-version shim gate verifies and archives the exact
          # released v0.68.2 tag/commit; a shallow PR checkout cannot prove it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Pinned released shim overlap (v1 + v2)
        run: make test-shim-overlap
      - name: Frozen attach-v1 v0.68.2 artifact bytes
        run: make test-attach-v1-compat

      # Build-tag-gated `_test.go` files are excluded from `go build ./...` and
      # `go test ./...` entirely — not run, not compiled, not syntax-checked —
      # so they rot silently behind a green pipeline. This type-checks them.
      # `internal/testregistration` fails the Test step below if a tag on disk
      # is missing from this target's list, so registration cannot lapse.
      - name: Type-check build-tag-gated tests
        run: make test-tagged

      # Piped through scripts/test-summary.py so the run reports how many
      # tests SKIPPED. `go test ./...` reports a skipped test the same way it
      # reports nothing at all — the package still says `ok` — so a test that
      # quietly starts skipping stops protecting anything while CI stays
      # green. pipefail keeps `go test`'s exit status authoritative.
      - name: Test
        run: |
          set -o pipefail
          go test -race -coverprofile=coverage.out -json ./... \
            | python3 scripts/test-summary.py

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4

      # No govulncheck step here: security-scan.yml already runs govulncheck
      # as its own `Go vuln scan (report-only)` job on the same triggers, in
      # parallel rather than serially behind the tests. The copy that used to
      # sit here was continue-on-error, so it gated nothing, and it re-ran
      # `go install ...@latest` on every build — a network fetch of an
      # unpinned tool inside the one job that main requires.
