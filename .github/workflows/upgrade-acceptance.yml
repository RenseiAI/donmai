name: upgrade-acceptance

# Container upgrade acceptance for headless session-shim adoption.
#
# Runs the N → N+1 daemon upgrade inside a Linux container that boots systemd
# as PID 1 with a lingering user manager and a delegated cgroup v2 subtree
# (upgradeacceptance/container/). The lane passes only when the driver's
# record equals ACCEPTANCE_EXPECT below.
#
# On this build the required record is the red one: the N+1 selection rule
# launches only interactive seats under shim ownership, so a headless seat
# dies with its daemon (cause headless_shim_launch_off) — the same red
# TestUpgradeAcceptanceRed pins in-repo. Everything the red stands on is
# asserted for real first (boot, user manager, delegated controllers, the
# toolchain go.mod requires, both artifacts, the generated unit, the restart
# preflight, and the upgrade served from a new PID), so an infrastructure
# failure fails the lane under its own name instead of passing as the red.
# When the adoption slices flip the rule the driver reports the record stale
# and the lane fails until the live-seat assertions replace it.
#
# This job never runs on the release-train host: it builds and runs its own
# container on the CI runner.

on:
  push:
    branches: [main]
    paths:
      - "upgradeacceptance/**"
      - ".github/workflows/upgrade-acceptance.yml"
  pull_request:
    branches: [main]
    paths:
      - "upgradeacceptance/**"
      - ".github/workflows/upgrade-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-upgrade:
    name: container upgrade (systemd user manager, delegated cgroup v2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # Artifact N is built from an earlier revision inside the container.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: In-repo harness gates
        run: |
          set -o pipefail
          GOWORK=off go test -race -count=1 ./upgradeacceptance/... 2>&1 | tail -5
          GOWORK=off go vet ./upgradeacceptance/...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4

      - name: Type-check build-tag-gated tests
        run: make test-tagged

      - name: Build the acceptance image
        run: docker build -f upgradeacceptance/container/Containerfile -t donmai-upgrade-acceptance .

      - name: Run the N to N+1 upgrade flow and check the record
        env:
          CONTAINER_ENGINE: docker
          # N is the base the change lands on: the first parent of the
          # pull-request merge commit, or the previous commit on a push.
          ACCEPTANCE_BASE_REV: HEAD~1
          ACCEPTANCE_EXPECT: red:headless_shim_launch_off
          ACCEPTANCE_RESULT_DIR: acceptance-results
        run: bash upgradeacceptance/container/run-lane.sh donmai-upgrade-acceptance

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-acceptance-record
          path: acceptance-results/
          if-no-files-found: warn
