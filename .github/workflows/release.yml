name: Release

# All verified tags publish immutable release assets. Only an automatic stable
# tag push may advance GitHub Latest or update the rolling stable Homebrew cask;
# prereleases and manual retries may not.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.4)"
        required: true

permissions:
  contents: write
  # Sigstore keyless signing exchanges this OIDC token for a short-lived
  # certificate — no private key is ever stored. Without it, `cosign sign-blob`
  # cannot mint an identity and the release fails closed rather than shipping
  # unsigned Linux archives.
  id-token: write
  # Required by actions/attest-build-provenance to write the attestation.
  attestations: write

jobs:
  release-authority:
    name: release-authority (signed tag + two rulesets)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify live release authority
        run: ./scripts/verify-release-authority.sh "${GITHUB_REPOSITORY}" "${RELEASE_TAG}"

  # W0(release-gate): before this job existed, release.yml ran GoReleaser
  # only — nothing between a `v*` tag push and a published Homebrew cask
  # ever ran a test or a smoke, so a broken pi RPC/extension protocol (the
  # exact regression donmai#215 had to fix by hand, after it had already
  # shipped) could ride a tag straight to `brew upgrade donmai` undetected.
  # This job runs the donmai-smokes suite — the SAME suite
  # .github/workflows/test.yml already runs on every PR/push/nightly —
  # against the EXACT tagged ref about to release (never against main), and
  # `release` below `needs:` it: a red harness-smoke blocks the publish.
  harness-smoke:
    needs: release-authority
    name: harness-smoke (donmai-smokes @ main, tag under test)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The tagged ref under test, checked out the same way the release job
      # below resolves it (namespace-qualified on workflow_dispatch so a
      # same-name branch cannot win ref resolution — mirrors "Checkout
      # release tag" further down).
      - name: Checkout donmai (tag under test)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          path: donmai
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # donmai-smokes is the harness, pinned to main (it is OSS-public and
      # has no release train of its own) — mirrors test.yml's two-repo
      # layout, just with the roles of "primary checkout" and "sibling under
      # test" swapped: here donmai-smokes is fixed and the tagged donmai ref
      # is the thing being proven.
      - name: Checkout donmai-smokes (harness, @main)
        uses: actions/checkout@v7
        with:
          repository: RenseiAI/donmai-smokes
          ref: main
          fetch-depth: 1
          path: donmai-smokes

      - name: Record donmai ref under test
        working-directory: donmai
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --pretty=%s)"
          {
            echo "### donmai under test (release-gate, tagged build)"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| SHA | \`${sha}\` |"
            echo "| subject | ${subject} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DONMAI_SHA_UNDER_TEST=${sha}" >> "$GITHUB_ENV"
          echo "donmai under test: ${sha} — ${subject}"

      - uses: actions/setup-go@v7
        with:
          go-version-file: donmai-smokes/go.mod
          cache: true
          cache-dependency-path: donmai-smokes/go.mod

      # `pi` (step20) and `opencode` (step18) are both `#!/usr/bin/env node`
      # scripts their respective harness/*_install.go helpers install
      # on-demand via npm when not already on PATH — node here is what keeps
      # step20's real-binary tests from DeclineLive-ing on a runner that
      # otherwise has no node at all (see test.yml for the full rationale).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Pre-build donmai binary (fail fast on a broken tagged build)
        working-directory: donmai
        run: |
          set -euo pipefail
          if ! GOWORK= go build -o "${RUNNER_TEMP}/donmai-prebuild" ./cmd/donmai; then
            echo "::error::donmai@${DONMAI_SHA_UNDER_TEST} (the tag under test) failed to build — release blocked before the smoke suite even ran."
            exit 1
          fi
          echo "donmai@${DONMAI_SHA_UNDER_TEST} build OK"

      - name: go vet (donmai-smokes)
        working-directory: donmai-smokes
        run: go vet ./...

      # GOWORK=off matches donmai-smokes' own gate (`make test`) and
      # test.yml. -v is piped to a log file so the guard steps below can
      # assert specific canaries actually reported PASS rather than SKIP —
      # `go test` exits 0 for both, so exit status alone cannot tell a real
      # regression from a lane that quietly stopped running.
      - name: go test (donmai-smokes, full suite incl. step20 pi lane)
        working-directory: donmai-smokes
        run: |
          set -o pipefail
          GOWORK=off go test -race -v ./... -timeout 20m 2>&1 | tee "${RUNNER_TEMP}/gotest.log"

      - name: Test outcome tally (pass / fail / skip)
        if: always()
        working-directory: donmai-smokes
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP}/gotest.log"
          if [ ! -f "$LOG" ]; then
            echo "no gotest.log (suite did not run) — nothing to tally"
            exit 0
          fi
          pass=$(grep -cE '^\s*--- PASS: ' "$LOG" || true)
          fail=$(grep -cE '^\s*--- FAIL: ' "$LOG" || true)
          skip=$(grep -cE '^\s*--- SKIP: ' "$LOG" || true)
          {
            echo "### Test outcomes (harness-smoke) — includes subtests"
            echo
            echo "| PASS | FAIL | SKIP |"
            echo "| ---: | ---: | ---: |"
            echo "| ${pass} | ${fail} | ${skip} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$skip" -gt 0 ]; then
            {
              echo
              echo "<details><summary>${skip} skipped test(s)</summary>"
              echo
              echo '```'
              grep -E '^\s*--- SKIP: ' "$LOG" | sed -E 's/^[[:space:]]*--- SKIP: //' | sort
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "outcomes: PASS=${pass} FAIL=${fail} SKIP=${skip}"
          grep -E '^\s*--- SKIP: ' "$LOG" || true

      # Same daemon-lifecycle canary test.yml gates on: this suite's whole
      # reason for existing is to run the live daemon, so a SKIP here means
      # the release-gate suite proved nothing even though `go test` exited 0.
      - name: Guard — daemon-lifecycle smoke must actually execute
        working-directory: donmai-smokes
        run: |
          LOG="${RUNNER_TEMP}/gotest.log"
          if grep -Eq '^\s*--- SKIP: TestAfDaemonLifecycle\b' "$LOG"; then
            echo "::error::TestAfDaemonLifecycle SKIPPED — the live-daemon lifecycle smoke did not run against donmai@${DONMAI_SHA_UNDER_TEST:-unknown} (the tag under test). Release blocked."
            exit 1
          fi
          if ! grep -Eq '^\s*--- PASS: TestAfDaemonLifecycle\b' "$LOG"; then
            echo "::error::TestAfDaemonLifecycle did not report PASS — daemon-lifecycle coverage did not execute against donmai@${DONMAI_SHA_UNDER_TEST:-unknown}. Release blocked."
            exit 1
          fi
          echo "Gate-liveness OK: daemon-lifecycle canary executed (PASS observed, no SKIP)."

      # The load-bearing addition for this Wave: the pi harness real-binary
      # lane (step20) is the coverage that would have caught donmai#215's
      # protocol gap BEFORE a tag shipped rather than after. It sits behind
      # four independent skip paths (see test.yml's identical guard for the
      # full list) — a silent SKIP on any of them must block the release,
      # not just get logged.
      - name: Guard — pi harness real-binary lane must actually execute
        working-directory: donmai-smokes
        run: |
          LOG="${RUNNER_TEMP}/gotest.log"
          fail=0
          for name in TestPiHarnessSmoke_RealBinary_HandshakeCompletes \
                      TestPiHarnessSmoke_RealBinary_Teardown \
                      TestPiHarnessSmoke_RealBinary_CompletedTurn; do
            if grep -Eq "^\s*--- SKIP: ${name}\b" "$LOG"; then
              echo "::error::${name} SKIPPED against donmai@${DONMAI_SHA_UNDER_TEST:-unknown} (the tag under test) — the pi harness real-binary lane did not run. This is the exact silent-skip shape that let a broken pi protocol ship undetected before. Release blocked."
              fail=1
            elif ! grep -Eq "^\s*--- PASS: ${name}\b" "$LOG"; then
              echo "::error::${name} did not report PASS against donmai@${DONMAI_SHA_UNDER_TEST:-unknown} — pi harness real-binary coverage did not execute. Release blocked."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Gate-liveness OK: pi harness real-binary lane executed against the tag under test (PASS observed for all 3 canaries, no SKIP)."

  release:
    needs: harness-smoke
    # macOS runner is required for codesign + xcrun notarytool.
    # Cross-compile to linux/amd64 + linux/arm64 still works from darwin via
    # CGO_ENABLED=0 (set in .goreleaser.yaml).
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    # Job-level env block, deliberately. Step-level env: blocks on
    # goreleaser/goreleaser-action@v7 (node24 action) did not propagate
    # APPLE_DEVELOPER_ID/APPLE_PASSWORD/APPLE_TEAM_ID to the goreleaser
    # subprocess, causing `signs[].env: APPLE_DEVELOPER_ID={{ .Env.APPLE_DEVELOPER_ID }}`
    # template eval to fail with `map has no entry for key
    # "APPLE_DEVELOPER_ID"`. Job-level env is always merged into the env
    # of every step subprocess, regardless of action runtime quirks.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
      APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # Stage the current workflow's verifier and GoReleaser policy outside the
      # workspace before checking out an older release tag. Otherwise an older
      # tag would run its historical automation and could still move Latest.
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Stage release automation
        run: |
          install -m 0755 scripts/verify-release-tag.sh "${RUNNER_TEMP}/verify-release-tag.sh"
          install -m 0644 .goreleaser.yaml "${RUNNER_TEMP}/goreleaser.yaml"
          install -d "${RUNNER_TEMP}/release-bin"
          install -m 0755 scripts/sign-and-notarize.sh \
            "${RUNNER_TEMP}/release-bin/donmai-sign-and-notarize"
          echo "${RUNNER_TEMP}/release-bin" >> "${GITHUB_PATH}"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # A manual rerun must build the requested tag, never the branch from
          # which workflow_dispatch was invoked. Keep the namespace explicit so
          # a same-name branch cannot win ref resolution.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify immutable release ref
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          "${RUNNER_TEMP}/verify-release-tag.sh" --verify \
            "${RELEASE_TAG}" \
            "${GITHUB_EVENT_NAME}" \
            "${GITHUB_OUTPUT}" \
            "${GITHUB_ENV}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            echo "::notice::Manual retry keeps GitHub Latest and the Homebrew cask unchanged."
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Import the Apple Developer ID Application certificate into an
      # ephemeral RUNNER_TEMP keychain so `codesign` (invoked by
      # scripts/sign-and-notarize.sh via GoReleaser's binary_signs: block) can find
      # the signing identity. RUNNER_TEMP is auto-cleaned up after the job,
      # so this never pollutes the runner's default keychain.
      #
      # Replaces GoReleaser's built-in `notarize:` block which fails with
      # `failed to verify certificate chain: x509: unhandled critical
      # extension` (Go's x509 strict mode rejects Apple's critical extension
      # 1.2.840.113635.100.6.1.13). This broke the v0.3.1 release.
      - name: Import Apple Developer ID cert to keychain
        if: env.APPLE_DEVELOPER_ID_CERT_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_DEVELOPER_ID_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # shellcheck disable=SC2046 # intentional word-split: keychain list is a space-separated argv
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          # Verify the identity is now available before handing off to GoReleaser.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      # Must precede GoReleaser: the `signs:` blocks shell out to `cosign`.
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # Keep the verified pipeline order fixed: binary_signs -> archives ->
          # checksums -> signs. Upgrade only with a source/docs re-verification.
          version: "v2.17.1"
          args: release --clean --config ${{ runner.temp }}/goreleaser.yaml

      # Build provenance for every published archive. This is a different claim
      # from the cosign signature: the signature says "this workflow signed this
      # blob", the attestation says "this artifact was built from this source at
      # this commit by this workflow". Consumers verify with:
      #   gh attestation verify <archive> --repo RenseiAI/donmai
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*.tar.gz
