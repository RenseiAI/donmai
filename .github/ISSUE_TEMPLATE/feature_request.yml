name: Feature request
description: Describe a problem you want Donmai to solve.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome and how you would verify it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any existing command or workaround you tried.
