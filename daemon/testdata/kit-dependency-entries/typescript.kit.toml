api = "donmai.dev/v2"

# ---------------------------------------------------------------------------
# Kit identity — base TypeScript foundation kit.
#
# This is the foundation half of the TypeScript split: it covers any
# TypeScript/Node project (tsconfig.json + package.json) WITHOUT assuming a
# framework. The `ts-nextjs` framework kit composes ON TOP of this for Next.js
# projects (it declares order = "framework" and detects next.config.* +
# package.json#dependencies.next).
# ---------------------------------------------------------------------------

[kit]
id = "default/typescript"
version = "2.0.0"
name = "TypeScript"
description = "OSS default foundation kit for TypeScript / Node projects. Detects tsconfig.json + package.json and provides Node 22, build/test/typecheck commands, and TS conventions."
author = "donmai"
authorIdentity = "did:web:donmai.dev"
license = "MIT"
homepage = "https://donmai.dev"
repository = "https://github.com/RenseiAI/donmai-kits"
priority = 70

[supports]
os = ["linux", "macos", "windows"]
arch = ["x86_64", "arm64"]

[requires]
rensei = "^1.0"
capabilities = []

# ---------------------------------------------------------------------------
# Detection — any TypeScript/Node project.
# ---------------------------------------------------------------------------

[detect]
# Match when tsconfig.json is present (Phase 1 declarative, any-exists).
files = ["tsconfig.json"]
# AND package.json must exist (all-exist).
files_all = ["package.json"]

# Toolchain pre-declared so the workarea/sandbox can pre-warm Node 22.
[detect.toolchain]
node = "22"

# ---------------------------------------------------------------------------
# Contributions
# ---------------------------------------------------------------------------

[provide.commands]
build    = "npm run build"
test     = "npm test"
validate = "npm run typecheck"

[provide.commands_override.windows]
build    = "npm.cmd run build"
test     = "npm.cmd test"
validate = "npm.cmd run typecheck"

[[provide.tool_permissions]]
shell = "npm *"

[[provide.tool_permissions]]
shell = "node *"

[[provide.tool_permissions]]
shell = "npx *"

[[provide.tool_permissions]]
shell = "tsc *"

[[provide.tool_permissions]]
shell = "git *"

[[provide.prompt_fragments]]
partial = "typescript-conventions"
when    = ["development", "qa", "refinement"]
file    = "partials/typescript-conventions.yaml"

[[provide.skills]]
file = "skills/typescript-debugging/SKILL.md"
id   = "typescript-debugging"

[provide.workarea_config]
clean_dirs    = ["dist", "build", ".tsbuildinfo", "coverage"]
preserve_dirs = ["~/.npm", "node_modules/.cache"]

# Per-OS toolchain install — used by the workarea/sandbox provider when Node 22
# is not pre-warmed in the pool. Cloud sandboxes are Linux, so the .linux
# script is the load-bearing one; .macos / .windows are local/dev parity.
[provide.toolchain_install.linux]
node_22 = "curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs"

[provide.toolchain_install.macos]
node_22 = "brew install node@22 && brew link --overwrite node@22"

[provide.toolchain_install.windows]
node_22 = "winget install OpenJS.NodeJS.LTS"

# ---------------------------------------------------------------------------
# Dependency stores — pnpm, one entry per store layout. The host's dependency
# preparation installs from these entries (fetch, then an offline frozen
# install, with no package code); this kit runs no install in a hook. Which
# entry applies is chosen by the version in the repository's `packageManager`
# pin: pnpm 9 keeps its store under `v3`, pnpm 10 under `v10`, so the two
# never mix. A repository pinning another major gets no entry. npm and yarn
# have no entry yet.
# ---------------------------------------------------------------------------

# pnpm 9 (store layout v3). Its index records live inside v3/files.
[[provide.dependency_store]]
manager   = "pnpm"
ecosystem = "node"
lockfiles = ["pnpm-lock.yaml"]
inputs    = ["pnpm-workspace.yaml", "**/package.json", ".npmrc", ".pnpmfile.cjs", "patches/**"]
version   = "pnpm --version"
versions  = ">=9 <10"

[provide.dependency_store.store]
env          = ["NPM_CONFIG_STORE_DIR"]
default      = { macos = "~/Library/pnpm/store", linux = "~/.local/share/pnpm/store" }
sharing      = "content-addressed"
integrity    = "on-use"
content      = ["v3/files"]
bookkeeping  = ["v3/projects"]
records_path = true

[provide.dependency_store.import]
env = { NPM_CONFIG_PACKAGE_IMPORT_METHOD = "clone-or-copy" }

# Every phase runs with package code and the repository's own pnpmfile off.
[provide.dependency_store.no_code]
env = { npm_config_ignore_scripts = "true", npm_config_ignore_pnpmfile = "true" }

# The per-run registry credential file is named by this variable, in the fetch
# phase only.
[provide.dependency_store.credentials]
config_env = "NPM_CONFIG_USERCONFIG"

[provide.dependency_store.commands]
fetch   = "pnpm fetch"
install = "pnpm install --offline --frozen-lockfile"
online  = "pnpm install --prefer-offline --frozen-lockfile"

[provide.dependency_store.snapshot]
installed         = ["node_modules", "**/node_modules"]
abi               = ["os", "arch", "libc", "node-abi"]
relocation        = "reconcile"
runs_package_code = true

# pnpm 10 (store layout v10).
[[provide.dependency_store]]
manager   = "pnpm"
ecosystem = "node"
lockfiles = ["pnpm-lock.yaml"]
inputs    = ["pnpm-workspace.yaml", "**/package.json", ".npmrc", ".pnpmfile.cjs", "patches/**"]
version   = "pnpm --version"
versions  = ">=10 <11"

[provide.dependency_store.store]
env          = ["NPM_CONFIG_STORE_DIR"]
default      = { macos = "~/Library/pnpm/store", linux = "~/.local/share/pnpm/store" }
sharing      = "content-addressed"
integrity    = "on-use"
content      = ["v10/files", "v10/index"]
bookkeeping  = ["v10/projects"]
records_path = true

[provide.dependency_store.import]
env = { NPM_CONFIG_PACKAGE_IMPORT_METHOD = "clone-or-copy" }

# Every phase runs with package code and the repository's own pnpmfile off.
[provide.dependency_store.no_code]
env = { npm_config_ignore_scripts = "true", npm_config_ignore_pnpmfile = "true" }

# The per-run registry credential file is named by this variable, in the fetch
# phase only.
[provide.dependency_store.credentials]
config_env = "NPM_CONFIG_USERCONFIG"

[provide.dependency_store.commands]
fetch   = "pnpm fetch"
install = "pnpm install --offline --frozen-lockfile"
online  = "pnpm install --prefer-offline --frozen-lockfile"

[provide.dependency_store.snapshot]
installed         = ["node_modules", "**/node_modules"]
abi               = ["os", "arch", "libc", "node-abi"]
relocation        = "reconcile"
runs_package_code = true

# ---------------------------------------------------------------------------
# Composition — foundation: base language layer, frameworks compose on top.
# ---------------------------------------------------------------------------

[composition]
order          = "foundation"
conflicts_with = []
composes_with  = ["default/ts-nextjs"]
